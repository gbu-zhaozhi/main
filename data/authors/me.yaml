bio: |
  Zhi Zhao is an Assistant Professor in the School of Advanced Engineering at
  Great Bay University (GBU). His research focuses on the design and optimization
  of intelligent materials and structures, developing inverse design frameworks
  for mechanics and multiphysics problems that connect theory, additive
  manufacturing, and experimental validation.

  Before joining GBU, he was a Postdoctoral Researcher at the University of
  Illinois Urbana-Champaign (UIUC), where he also earned his Ph.D. in Civil
  Engineering. His work has appeared in Science Advances, Advanced Functional
  Materials, npj Computational Materials, and the Journal of the Mechanics and
  Physics of Solids, among others, and a first-author paper of his received the
  ASME Henry Hess Early Career Publication Award.

