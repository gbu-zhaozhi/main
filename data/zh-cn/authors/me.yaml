name:
  display: "赵志"
  given: "志"
  family: "赵"
  alternate: "Zhi Zhao"
role: "助理教授"
bio: |
  赵志，大湾区大学先进工程学院助理教授、研究员。研究聚焦先进功能材料与智能结构的设计优化，致力于发展面向力学及多物理场问题的逆向设计框架。课题组坚持"设计-制造-实验验证"贯通的研究思路，将理论计算、增材制造制备与实验表征紧密结合，推动基础研究成果向先进工程结构、软体机器人与生物医疗装备等实际应用场景落地转化。

  加入大湾区大学之前，他于伊利诺伊大学厄巴纳-香槟分校（UIUC）从事博士后研究，并在该校获得土木工程博士学位。相关工作发表于 Science Advances、Advanced Functional Materials、npj Computational Materials、Journal of the Mechanics and Physics of Solids 等国际知名期刊，谷歌学术引用 1000 余次；以第一作者完成的论文曾获 ASME Henry Hess 青年发表奖（该奖项每年仅 1 篇）。

